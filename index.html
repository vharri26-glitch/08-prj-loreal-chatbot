<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>L'Oréal | Your Beauty Assistant</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">

    <header class="site-header">
      <div class="logo-wrap">
        <img src="assets/loreal-logo.png" alt="L'Oréal Paris"
             class="brand-logo"
             onerror="this.hidden=true;this.nextElementSibling.hidden=false">
        <span class="logo-fallback" hidden>L'ORÉAL <small>PARIS</small></span>
      </div>

      <p class="eyebrow">YOUR PERSONAL BEAUTY CONSULTATION</p>
      <h1>Beauty, your way.</h1>
      <p class="subhead">Good advice starts with what you already have.</p>
    </header>

    <main class="vanity">
      <div class="wall-panel panel-left"></div>
      <div class="wall-panel panel-right"></div>

      <!-- LEFT VANITY DECORATIONS -->
      <div class="vanity-art vanity-art-left" aria-hidden="true">

        <!-- Wall light -->
        <svg class="sconce" viewBox="0 0 100 200">
          <rect x="34" y="5" width="34" height="110"
                rx="13" fill="#fff8e9" stroke="#302924" stroke-width="2"/>
          <path d="M42 16v87 M50 14v90 M58 16v87"
                stroke="#c7a36e" stroke-width="1.5"/>
          <circle cx="50" cy="136" r="24"
                  fill="#f3e3cd" stroke="#302924" stroke-width="2"/>
          <circle cx="50" cy="136" r="12"
                  fill="none" stroke="#b08e5b" stroke-width="2"/>
          <path d="M50 155v29" stroke="#302924"
                stroke-width="5" stroke-linecap="round"/>
        </svg>

        <!-- Flowers, makeup brushes, perfume -->
        <svg class="left-products" viewBox="0 0 300 365">
          <g stroke="#302924" stroke-width="2.3"
             fill="none" stroke-linejoin="round" stroke-linecap="round">

            <!-- Flower stems -->
            <path d="M48 268C55 215 74 148 83 72
                     M49 269C37 214 27 160 17 106
                     M48 250C92 198 110 163 129 128"
                  stroke="#80734e"/>

            <!-- Leaves -->
            <path d="M80 118Q34 84 27 31Q71 43 80 118Z
                     M78 151Q110 79 160 72Q137 125 78 151Z
                     M49 192Q5 159 1 128Q36 129 49 192Z"
                  fill="#f9f2e7"/>

            <!-- Lily petals -->
            <path d="M83 65C61 36 56 12 83 24C89 37 86 57 83 65Z
                     M84 64C101 38 125 25 125 49C112 64 98 68 84 64Z
                     M83 64C72 88 69 102 86 107C98 87 93 76 83 64Z
                     M83 65C102 68 125 85 116 99C96 95 87 85 83 65Z
                     M83 65C59 77 40 86 44 101C63 95 76 82 83 65Z"
                  fill="#fcf9f2"/>

            <path d="M83 65l5-22m-5 22l-18-19m18 19l19 6m-19-6l-13 19"
                  stroke="#bd9766"/>

            <!-- Vase -->
            <path d="M29 239h51l-5 10v82q-20 17-40 0v-82Z"
                  fill="#fffcf5"/>
            <ellipse cx="54" cy="239" rx="25" ry="6"
                     fill="#f4e7d6"/>

            <!-- Makeup brush handles -->
            <path d="M131 315l-30-95
                     M143 314l-4-115
                     M158 317l17-91"/>

            <!-- Makeup brush heads -->
            <path d="M107 216q-24-42-3-49q22 12 29 43Z
                     M136 194q-17-49-1-53q17 8 20 51Z
                     M175 226q2-45 20-45q14 18-15 51Z"
                  fill="#ead3b6"/>

            <!-- Brush holder -->
            <path d="M107 260h83l-9 79h-63Z"
                  fill="#fff9ef"/>
            <ellipse cx="148" cy="260" rx="41" ry="8"
                     fill="#f3e5d4"/>

            <path d="M125 268v60 M140 268v60
                     M156 268v60 M172 268v60"
                  stroke="#cfb489" stroke-width="1.2"/>

            <!-- Perfume bottle -->
            <rect x="211" y="258" width="70" height="83"
                  rx="14" fill="#fffaf2"/>
            <rect x="229" y="235" width="35" height="25"
                  rx="4" fill="#ead3b6"/>
            <circle cx="247" cy="223" r="12"
                    fill="#f9eddb"/>
            <path d="M226 288h40 M226 314h40"
                  stroke="#cdb48f" stroke-width="1"/>
          </g>
        </svg>
      </div>

      <!-- INTERACTIVE MIRROR -->
      <section class="mirror" aria-label="Beauty assistant conversation">
        <div class="mirror-surface">
          <div class="mirror-crown" aria-hidden="true">✧</div>

          <div class="mirror-heading">
            <p>A MOMENT FOR YOU</p>
            <h2>Your beauty assistant</h2>
          </div>

          <div id="chatWindow"
               class="chat-window"
               role="log"
               aria-live="polite"
               aria-label="Conversation">
          </div>
        </div>
      </section>

      <!-- RIGHT VANITY DECORATIONS -->
      <div class="vanity-art vanity-art-right" aria-hidden="true">

        <!-- Matching wall light -->
        <svg class="sconce" viewBox="0 0 100 200">
          <rect x="34" y="5" width="34" height="110"
                rx="13" fill="#fff8e9" stroke="#302924" stroke-width="2"/>
          <path d="M42 16v87 M50 14v90 M58 16v87"
                stroke="#c7a36e" stroke-width="1.5"/>
          <circle cx="50" cy="136" r="24"
                  fill="#f3e3cd" stroke="#302924" stroke-width="2"/>
          <circle cx="50" cy="136" r="12"
                  fill="none" stroke="#b08e5b" stroke-width="2"/>
          <path d="M50 155v29" stroke="#302924"
                stroke-width="5" stroke-linecap="round"/>
        </svg>

        <!-- Serum, lotion, cream, compact, lipstick -->
        <svg class="right-products" viewBox="0 0 300 365">
          <g fill="none" stroke="#302924"
             stroke-width="2.3" stroke-linejoin="round"
             stroke-linecap="round">

            <!-- Serum bottle -->
            <rect x="11" y="253" width="66" height="88"
                  rx="9" fill="#fffaf2"/>
            <path d="M27 253v-28h34v28" fill="#eee0ce"/>
            <path d="M44 225v-38m-9 0q9-21 18 0Z"
                  fill="#f8eee2"/>
            <path d="M22 311h44 M22 317h44"
                  stroke="#c8aa7e" stroke-width="1"/>

            <!-- Pump moisturizer -->
            <rect x="86" y="223" width="83" height="118"
                  rx="13" fill="#fffaf2"/>
            <path d="M110 223v-20h36v20
                     M129 203v-22h43v8h-28"
                  fill="#f3e6d6"/>
            <path d="M100 255h55 M99 300h56"
                  stroke="#cfb48f" stroke-width="1"/>

            <!-- Cream jar -->
            <rect x="177" y="292" width="96" height="49"
                  rx="12" fill="#fffaf2"/>
            <rect x="173" y="275" width="105" height="22"
                  rx="5" fill="#efe2d1"/>
            <path d="M190 312h68"
                  stroke="#cdb48f" stroke-width="1"/>

            <!-- Makeup compact -->
            <ellipse cx="236" cy="245" rx="45" ry="16"
                     fill="#fff8ee"/>
            <path d="M190 242q-12-46 27-66
                     q45-21 60 18q9 25-6 46"
                  fill="#fff8ef"/>
            <ellipse cx="234" cy="207" rx="31" ry="20"
                     stroke="#c9a97b" stroke-width="1.4"/>

            <!-- Lipstick -->
            <rect x="24" y="307" width="21" height="34"
                  fill="#ecdbcc"/>
            <rect x="28" y="276" width="13" height="31"
                  fill="#faf1e6"/>
            <path d="M28 277v-18q5-20 13-13v31"
                  fill="#e2bba5"/>
          </g>
        </svg>
      </div>

      <!-- VANITY TABLETOP WITH REAL CHAT INPUT -->
      <div class="vanity-top">
        <div class="marble-vein vein-one" aria-hidden="true"></div>
        <div class="marble-vein vein-two" aria-hidden="true"></div>

        <form id="chatForm" class="chat-form">
          <label class="visually-hidden" for="userInput">
            Ask your beauty question
          </label>

          <input
            id="userInput"
            name="userInput"
            type="text"
            placeholder="Ask your beauty question..."
            autocomplete="off"
            required
          >

          <button id="sendBtn" type="submit" aria-label="Send question">
            <svg viewBox="0 0 24 24" width="20" height="20"
                 fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5 M5 12l7-7 7 7"/>
            </svg>
          </button>
        </form>
      </div>

      <!-- VANITY DRAWERS -->
      <div class="vanity-front" aria-hidden="true">
        <div class="drawer left-drawer"><span></span></div>
        <div class="drawer center-drawer"><span></span></div>
        <div class="drawer right-drawer"><span></span></div>
      </div>
    </main>

    <footer class="site-footer">
      <span>BEAUTY IS PERSONAL.</span>
      <p>Independent educational chatbot project inspired by L'Oréal.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
